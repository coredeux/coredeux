services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coredeux_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coredeux_oss"]
      interval: 5s
      timeout: 5s
      retries: 20

  coredeux-java-native-demo:
    build:
      context: ../..
      dockerfile: examples/coredeux-java-native-demo/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COREDEUX_NATIVE_PORT: 8080
      COREDEUX_POSTGRES_URL: jdbc:postgresql://postgres:5432/coredeux_oss
      COREDEUX_POSTGRES_USER: postgres
      COREDEUX_POSTGRES_PASSWORD: root
    ports:
      - "8080:8080"
