coredeux:
  entities:
    config-location: classpath:coredeux-entities.yml
  demo:
    database:
      host: localhost
      port: 5432
      name: coredeux_oss
      user: postgres
      password: root
    mongodb:
      host: localhost
      port: 27017
      database: coredeux_oss
    elasticsearch:
      host: localhost
      port: 9200
      scheme: http
    redis:
      host: localhost
      port: 6379
  import:
    default-parser: text
  export:
    default-format: TEXT
    log:
      default-service: defaultCoredeuxExportLogService
    storage:
      default-service: defaultCoredeuxFileSystemExportStorageService
      filesystem:
        base-directory: ${java.io.tmpdir}/coredeux-export
    worker:
      enabled: true
      delay-ms: 5000
      max-parallel: 2
