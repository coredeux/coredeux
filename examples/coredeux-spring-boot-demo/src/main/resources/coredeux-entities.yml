coredeux:
  entities:
    - full-class-name: com.coredeux.demo.domain.Customer
      name: customer
      identifier: pk
      storage:
        data-access-service: postgresCoredeuxJpaDataAccessService
      modules:
        - name: validators
          enabled: true
          handlers:
            - customerEmailValidator
        - name: hooks
          enabled: true
          handlers:
            - demoLifecycleHook
        - name: audit
          enabled: true
          handlers:
            - demoAuditHandler
          config:
            operations:
              - SAVE
              - UPDATE
              - DELETE
        - name: workflows
          enabled: true
          handlers:
            - customerApprovalWorkflow
          config:
            phases:
              - after-save
    - full-class-name: com.coredeux.demo.domain.Product
