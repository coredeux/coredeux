services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coredeux_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coredeux_oss"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  coredeux-drl-spring-boot-demo:
    build:
      context: ../..
      dockerfile: examples/coredeux-drl-spring-boot-demo/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      COREDEUX_DEMO_DB_HOST: postgres
      COREDEUX_DEMO_DB_PORT: 5432
      COREDEUX_DEMO_DB_NAME: coredeux_oss
      COREDEUX_DEMO_DB_USER: postgres
      COREDEUX_DEMO_DB_PASSWORD: root
      COREDEUX_DEMO_REDIS_HOST: redis
      COREDEUX_DEMO_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005}
    ports:
      - "8080:8080"
      - "5005:5005"
